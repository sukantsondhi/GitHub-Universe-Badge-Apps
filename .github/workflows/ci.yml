name: Badge Apps CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  badge-and-controller:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          python -m pip install -r laptop/requirements-media.txt
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Compile badge and desktop apps
        run: |
          python -m compileall -q apps laptop tools
      - name: Run tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s laptop/tests -v
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s laptop/tests -v
  secret-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl -fsSL "$base/$archive" -o "$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep " $archive$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Audit working tree and complete history
        run: python tools/audit_secrets.py --gitleaks "$RUNNER_TEMP/gitleaks"
